[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-rl-agentic-rag"
version = "4.0.0"
description = "Evidence-grounded, cost-aware multi-agent RAG with contextual bandit routing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "openai>=1.50",
    "pypdf>=4.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Fully offline generation/embeddings (no API key required).
local = ["sentence-transformers>=2.2"]
# Local LoRA/SFT/quantization pipeline.
training = ["torch>=2.0", "transformers>=4.36", "peft>=0.7", "datasets>=2.16", "accelerate>=0.25"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["contextual_rl_agentic_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
